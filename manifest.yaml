# What the module is and may do; `wayseer dev sign` adds its program's sha256, os and arch.
id: wayseer-labs/aircraft
name: Aircraft
description: Live aircraft from ADS-B, read from adsb.lol or a local readsb or dump1090 receiver.
homepage: https://github.com/wayseer-net/desktop-module-aircraft
version: 0.1.1               # raise it for each version published
contract: 1
namespace: aircraft          # allocated by Wayseer for the marketplace
kinds:
  - {kind: aircraft/aircraft, label: Aircraft, plural: Aircraft, like: host}
  - {kind: aircraft/operator, label: Operator, plural: Operators, like: team}
  - {kind: aircraft/area, label: Area, plural: Areas, like: cluster}
network: [api.adsb.lol:443, configured by user]
secrets: true                # a receiver's token may be in the keyring
