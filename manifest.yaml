# What the module is and may do; `wayseer dev sign` adds its program's sha256, os and arch.
id: wayseer-labs/aircraft
name: Aircraft
description: Live aircraft from ADS-B, read from adsb.lol or a local readsb or dump1090 receiver.
version: 0.1.0               # raise it for each package signed
contract: 1
namespace: aircraft          # allocated by Wayseer for the marketplace
kinds:
  - {kind: host}
  - {kind: service}
  - {kind: database}
actions:
  - id: recheck
    title: Recheck
    changes: "Nothing: it reads the item from the inventory again and says its status"
    kinds: [host, service, database]
network: [api.adsb.lol:443, configured by user]
secrets: true
